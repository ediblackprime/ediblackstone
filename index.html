<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marcela App</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4a148c">
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #ffffff;
            --accent-color: #4a148c;
            --success-color: #81c784;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .top-bar {
            background-color: var(--accent-color);
            padding: 8px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
        }

        .header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-radius: 0 0 12px 12px; 
            margin-top: 0;
            padding: 20px;
            
            /* Fondo con la imagen de tulipanes y capa oscura para legibilidad */
            background-image: linear-gradient(rgba(0, 0, 0, 0.45), rgba(0, 0, 0, 0.45)), url('https://as1.ftcdn.net/jpg/02/66/90/28/1000_F_266902867_XzTGdah6CEBFjrsJySBkqGedXZw7UExs.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        .container {
            padding: 15px;
            max-width: 600px;
            margin: 0 auto;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
        }

        .title-section {
            font-size: 1.5rem;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .total-amount {
            font-size: 1.8rem;
            font-weight: bold;
            color: var(--success-color);
        }

        /* Controles y formulario original */
        .form-group {
            margin-bottom: 10px;
        }

        input, button {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border-radius: 6px;
            border: none;
            box-sizing: border-box;
            font-size: 1rem;
        }

        input {
            background-color: #2c2c2c;
            color: var(--text-color);
        }

        button {
            background-color: var(--accent-color);
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        /* Estilos de la tabla original */
        .table-container {
            margin-top: 15px;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background-color: var(--card-bg);
            border-radius: 8px;
            overflow: hidden;
        }

        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #333;
        }

        th {
            background-color: #2c2c2c;
            color: var(--text-color);
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <span id="datetime">Cargando fecha...</span>
        <span style="background: rgba(255,255,255,0.2); padding: 4px 10px; border-radius: 12px;">Black Mode: ON</span>
    </div>

    <div class="container">
        <!-- Encabezado con los tulipanes -->
        <div class="header card">
            <div class="title-section">MARCELA</div>
            <div class="total-amount" id="total-display">$0.00</div>
        </div>

        <!-- Panel de entrada original para agregar registros -->
        <div class="card">
            <div class="form-group">
                <input type="text" id="desc-input" placeholder="Descripción del producto o venta">
            </div>
            <div class="form-group">
                <input type="number" id="monto-input" placeholder="Monto ($)">
            </div>
            <button onclick="agregarRegistro()">Agregar Registro</button>
        </div>

        <!-- Tabla completa con persistencia -->
        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Descripción</th>
                        <th>Monto</th>
                        <th>Acción</th>
                    </tr>
                </thead>
                <tbody id="data-table-body">
                    <!-- Los registros se cargan dinámicamente aquí -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // Reloj y fecha en tiempo real
        function updateDateTime() {
            const now = new Date();
            const options = { weekday: 'long', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit' };
            document.getElementById('datetime').innerText = now.toLocaleDateString('es-ES', options);
        }
        setInterval(updateDateTime, 1000);
        updateDateTime();

        // Lógica de datos y localStorage
        let registros = JSON.parse(localStorage.getItem('marcela_registros')) || [];

        function guardarYRenderizar() {
            localStorage.setItem('marcela_registros', JSON.stringify(registros));
            renderizarTabla();
        }

        function agregarRegistro() {
            const desc = document.getElementById('desc-input').value.trim();
            const monto = parseFloat(document.getElementById('monto-input').value);

            if (!desc || isNaN(monto)) {
                alert('Por favor ingresa una descripción y un monto válido.');
                return;
            }

            registros.push({ desc, monto });
            document.getElementById('desc-input').value = '';
            document.getElementById('monto-input').value = '';
            guardarYRenderizar();
        }

        function eliminarRegistro(index) {
            registros.splice(index, 1);
            guardarYRenderizar();
        }

        function renderizarTabla() {
            const tbody = document.getElementById('data-table-body');
            tbody.innerHTML = '';
            let total = 0;

            if (registros.length === 0) {
                tbody.innerHTML = '<tr><td colspan="3" style="text-align: center; color: #888;">No hay registros aún</td></tr>';
            } else {
                registros.forEach((item, index) => {
                    total += item.monto;
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${item.desc}</td>
                        <td>$${item.monto.toFixed(2)}</td>
                        <td><button onclick="eliminarRegistro(${index})" style="background-color: #d32f2f; padding: 5px 10px; font-size: 0.8rem;">X</button></td>
                    `;
                    tbody.appendChild(tr);
                });
            }

            document.getElementById('total-display').innerText = `$${total.toFixed(2)}`;
        }

        // Cargar al iniciar
        renderizarTabla();

        // Registro del Service Worker con versión v9 (para forzar la actualización con todos los elementos)
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js')
            .then(() => console.log('Service Worker registrado con éxito.'))
            .catch(err => console.log('Error al registrar Service Worker:', err));
        }
    </script>
</body>
</html>
